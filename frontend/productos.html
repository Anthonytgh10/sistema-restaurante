<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos · sistema-restaurante-main</title><link rel="icon" href="logo.svg"><link rel="stylesheet" href="styles.css"></head>
<body onload="cargarProductos()"><div class="container"><header class="header"><div class="brand"><img src="logo.svg" alt="logo"><h1>Productos</h1></div><div class="actions"><button class="btn ghost" onclick="logout()">Salir</button></div></header><nav class="nav">
<a class="tab" href="index.html">Inicio</a>
<a class="tab" href="usuarios.html">Usuarios</a>
<a class="tab active" href="productos.html">Productos</a>
<a class="tab" href="clientes.html">Clientes</a>
<a class="tab" href="pedidos.html">Pedidos</a>
<a class="tab" href="reset.html">Recuperar</a>
</nav>
<section class="grid"><div class="card half"><h2>Listado</h2>
<div class="row"><input id="p-q" class="input" placeholder="Buscar por nombre"><button class="btn" onclick="cargarProductos()">Buscar</button></div>
<table class="table"><thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Activo</th><th></th></tr></thead><tbody id="productos-body"></tbody></table></div>
<div class="card half"><h2>Crear / Editar</h2><form class="row" onsubmit="submitProducto(event)"><input name="id" type="hidden">
<input name="nombre" class="input" placeholder="Nombre *"><textarea name="descripcion" class="input" placeholder="Descripción"></textarea>
<input name="precio" class="input" placeholder="Precio *" type="number" step="0.01"><input name="stock" class="input" placeholder="Stock *" type="number" step="1">
<select name="activo"><option value="1">Activo</option><option value="0">Inactivo</option></select>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" type="button" onclick="resetFormProducto()">Limpiar</button><button class="btn" type="submit">Guardar</button></div>
</form></div></section><footer class="footer">© <span id="y"></span> sistema-restaurante-main</footer></div><div class="toast"></div><script src="app.js"></script><script>document.getElementById('y').textContent=new Date().getFullYear();</script></body></html>
