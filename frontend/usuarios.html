<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · sistema-restaurante-main</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="container">
<h1>Usuarios</h1>
<div class="nav"><a href="index.html">Inicio</a><a href="login.html">Iniciar sesión</a><a class="active" href="usuarios.html">Usuarios</a></div>

<div class="card">
  <h2>Crear usuario</h2>
  <form id="fnew" class="grid" onsubmit="return crearUsuario(event)">
    <input name="username" class="input" placeholder="Usuario *">
    <input name="email" class="input" type="email" placeholder="Correo *">
    <input name="first_name" class="input" placeholder="Nombre">
    <input name="last_name" class="input" placeholder="Apellido">
    <select name="rol"><option>ADMIN</option><option>MESERO</option><option>CAJA</option></select>
    <input name="password" class="input" type="password" placeholder="Contraseña *">
    <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost" type="reset">Limpiar</button>
      <button class="btn" type="submit">Crear</button>
    </div>
  </form>
  <p class="small">La contraseña debe tener 10+ caracteres, mayúscula, minúscula, número y símbolo.</p>
</div>

<div class="card">
  <h2>Listado</h2>
  <table>
    <thead><tr><th>ID</th><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = localStorage.getItem('api_base') || 'http://127.0.0.1:8000/api';
function access(){ return localStorage.getItem('access')||''; }
function show(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function req(path, opts){ return fetch(API_BASE+path, { ...(opts||{}), headers:{'Content-Type':'application/json','Authorization': 'Bearer '+access(), ...(opts&&opts.headers||{})}}); }

async function listar(){
  if(!access()){ show('Inicia sesión primero'); return; }
  const res = await req('/usuarios/'); const data = await res.json();
  const tb = document.getElementById('tbody'); tb.innerHTML='';
  (data||[]).forEach(u=>{
    const tr = document.createElement('tr'); tr.className='tr';
    tr.innerHTML = `<td>${u.id}</td><td>${u.username}</td><td>${u.email||''}</td><td>${u.rol||'-'}</td>
      <td><span class="pill" style="border-color:${u.is_active?'#1b6f41':'#7a1a1a'}">${u.is_active?'Activo':'Inactivo'}</span></td>
      <td style="text-align:right">${u.is_active?`<button class="btn ghost" onclick="toggleUser(${u.id}, false)">Desactivar</button>`:`<button class="btn" onclick="toggleUser(${u.id}, true)">Reactivar</button>`}</td>`;
    tb.appendChild(tr);
  });
}

async function crearUsuario(ev){
  ev.preventDefault();
  if(!access()){ alert('Inicia sesión primero'); return false; }
  const f = document.getElementById('fnew');
  const payload = { username:f.username.value.trim(), email:f.email.value.trim(), first_name:f.first_name.value.trim(), last_name:f.last_name.value.trim(), rol:f.rol.value, password:f.password.value };
  if(!payload.username || !payload.email || !payload.password){ show('Completa los obligatorios'); return false; }
  const res = await req('/usuarios/', {method:'POST', body: JSON.stringify(payload)});
  if(!res.ok){ const e=await res.json().catch(()=>({})); alert(e.error||e.detail||'Error al crear'); return false; }
  f.reset(); show('Usuario creado'); listar(); return false;
}

async function toggleUser(id, active){
  const opts = active ? {method:'PATCH', body: JSON.stringify({id, is_active:true})} : {method:'DELETE', body: JSON.stringify({id})};
  const res = await req('/usuarios/', opts);
  if(!res.ok){ const e=await res.json().catch(()=>({})); alert(e.error||e.detail||'Error'); return; }
  show(active?'Usuario reactivado':'Usuario desactivado'); listar();
}

window.addEventListener('load', listar);
</script>
</body></html>
